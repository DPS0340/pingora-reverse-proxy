[package]
name = "pingora-reverse-proxy"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/DPS0340/pingora-reverse-proxy"

[dependencies]
arc-swap = "1.7"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
constant_time_eq = "0.4"
futures-util = "0.3"
http = "1"
httparse = "1"
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
libc = "0.2"
openssl = "0.10"
pingora = { version = "0.8.1", features = ["proxy", "openssl"] }
prometheus = "0.14"
redis = { version = "0.32", features = ["aio", "tokio-comp"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5.7"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-openssl = "0.6"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }
webpki-roots = "1"

[dev-dependencies]
pingora-load-balancing = "0.8.1"
proptest = "1.7"
serial_test = "3"
tempfile = "3"
tokio-tungstenite = "0.27"
wiremock = "0.6"

[patch.crates-io]
pingora-core = { path = "vendor/pingora-core-0.8.1" }
pingora-load-balancing = { path = "vendor/pingora-load-balancing-0.8.1" }
