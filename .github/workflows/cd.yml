name: Publish verified container

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pingora-container-publication
  cancel-in-progress: false

env:
  IMAGE_NAME: pingora-reverse-proxy

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Check out the verified commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Select one strict SemVer release tag
        id: release
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          [[ ${VERIFIED_SHA} =~ ^[0-9a-f]{40}$ ]]
          mapfile -t tags_at_sha < <(git tag --points-at "${VERIFIED_SHA}")
          release_tags=()
          for tag in "${tags_at_sha[@]}"; do
            if ruby scripts/release-policy.rb "${tag}" >/dev/null 2>&1; then
              release_tags+=("${tag}")
            fi
          done
          if (( ${#release_tags[@]} != 1 )); then
            echo "expected exactly one release tag on verified commit" >&2
            exit 1
          fi
          ruby scripts/release-policy.rb "${release_tags[0]}" >> "${GITHUB_OUTPUT}"

      - name: Download exact image from the verified workflow run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: verified-image-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/pingora-verified-image
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify and load the tested image bytes
        id: candidate
        shell: bash
        env:
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -Eeuo pipefail
          scripts/image-artifact.sh verify \
            "${RUNNER_TEMP}/pingora-verified-image/image.tar" \
            "${RUNNER_TEMP}/pingora-verified-image/metadata.env" \
            "${VERIFIED_SHA}" \
            "${VERIFIED_RUN_ID}" | tee "${RUNNER_TEMP}/pingora-verified-image/verification.log"
          grep -E '^verified_image_id=sha256:[0-9a-f]{64}$' \
            "${RUNNER_TEMP}/pingora-verified-image/verification.log" >> "${GITHUB_OUTPUT}"

      - name: Authenticate to GHCR
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/pingora-docker-config
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "${DOCKER_CONFIG}"
          echo "${GHCR_TOKEN}" | timeout 30s docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Recheck release authority and promote the exact manifest
        id: publish
        shell: bash
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/pingora-docker-config
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          VERSION_TAG: ${{ steps.release.outputs.docker_tag }}
          VERIFIED_IMAGE_ID: ${{ steps.candidate.outputs.verified_image_id }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -Eeuo pipefail
          trap 'timeout 30s docker logout ghcr.io >/dev/null 2>&1 || true; rm -rf -- "${DOCKER_CONFIG}"' EXIT
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          sha_tag="sha-${VERIFIED_SHA}"
          candidate_tag="candidate-${VERIFIED_SHA}-${WORKFLOW_RUN_ID}-${WORKFLOW_RUN_ATTEMPT}"
          [[ ${VERIFIED_SHA} =~ ^[0-9a-f]{40}$ ]]
          [[ ${WORKFLOW_RUN_ID} =~ ^[0-9]+$ ]]
          [[ ${WORKFLOW_RUN_ATTEMPT} =~ ^[0-9]+$ ]]

          recheck_release_tag() {
            timeout 60s git fetch --force --no-tags origin \
              "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "${VERIFIED_SHA}"
          }

          remote_digest() {
            local reference=$1 output error_file
            error_file=$(mktemp "${RUNNER_TEMP}/remote-manifest.XXXXXX")
            if output=$(timeout 60s docker buildx imagetools inspect \
              "${reference}" --format '{{json .Manifest}}' 2>"${error_file}"); then
              rm -f "${error_file}"
              ruby -rjson -e '
                digest = JSON.parse(STDIN.read).fetch("digest")
                abort "invalid remote digest" unless /\Asha256:[0-9a-f]{64}\z/.match?(digest)
                puts digest
              ' <<<"${output}"
              return 0
            fi
            if grep -Eiq '((^|: )not found$|manifest unknown|not found: manifest|no such manifest)' "${error_file}"; then
              rm -f "${error_file}"
              return 1
            fi
            cat "${error_file}" >&2
            rm -f "${error_file}"
            return 2
          }

          require_absent_tag() {
            local reference=$1 existing status
            set +e
            existing=$(remote_digest "${reference}")
            status=$?
            set -e
            if (( status == 0 )); then
              echo "refusing to overwrite existing image tag ${reference} at ${existing}" >&2
              exit 1
            fi
            (( status == 1 )) || exit "${status}"
          }

          recheck_release_tag
          require_absent_tag "${image}:${VERSION_TAG}"
          require_absent_tag "${image}:${sha_tag}"
          require_absent_tag "${image}:${candidate_tag}"
          timeout 30s docker image tag "${VERIFIED_IMAGE_ID}" "${image}:${candidate_tag}"
          timeout 600s docker push "${image}:${candidate_tag}"
          candidate_digest=$(remote_digest "${image}:${candidate_tag}")

          require_absent_tag "${image}:${VERSION_TAG}"
          require_absent_tag "${image}:${sha_tag}"
          recheck_release_tag
          timeout 120s docker buildx imagetools create \
            --prefer-index=false \
            --tag "${image}:${VERSION_TAG}" \
            --tag "${image}:${sha_tag}" \
            --metadata-file "${RUNNER_TEMP}/promotion-metadata.json" \
            "${image}@${candidate_digest}"
          promotion_digest=$(ruby -rjson -e \
            'puts JSON.parse(File.read(ARGV.fetch(0))).fetch("containerimage.descriptor").fetch("digest")' \
            "${RUNNER_TEMP}/promotion-metadata.json")
          test "${promotion_digest}" = "${candidate_digest}"
          test "$(remote_digest "${image}:${VERSION_TAG}")" = "${candidate_digest}"
          test "$(remote_digest "${image}:${sha_tag}")" = "${candidate_digest}"
          {
            echo "image=${image}"
            echo "digest=${candidate_digest}"
            echo "version_ref=${image}:${VERSION_TAG}"
            echo "sha_ref=${image}:${sha_tag}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest published image provenance
        id: attest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ${{ steps.publish.outputs.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Report digest and provenance
        shell: bash
        run: |
          {
            echo "Release: ${{ steps.release.outputs.release_tag }}"
            echo "Verified source: ${{ github.event.workflow_run.head_sha }}"
            echo "Published digest: ${{ steps.publish.outputs.digest }}"
            echo "Version ref: ${{ steps.publish.outputs.version_ref }}"
            echo "Commit ref: ${{ steps.publish.outputs.sha_ref }}"
            echo "Attestation: ${{ steps.attest.outputs.attestation-url }}"
          } >> "${GITHUB_STEP_SUMMARY}"
