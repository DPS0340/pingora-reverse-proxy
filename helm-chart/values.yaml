replicaCount: 1

image:
  repository: ghcr.io/dps0340/pingora-reverse-proxy
  pullPolicy: IfNotPresent
  tag: "0.2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

auth:
  existingSecret: pingora-reverse-proxy-auth
  tokenKey: token

listeners:
  public:
    ip: 0.0.0.0
    port: 8000
  api:
    ip: 0.0.0.0
    port: 8001
  metrics:
    ip: 0.0.0.0
    port: 8002

services:
  public:
    enabled: true
    type: ClusterIP
    port: 8000
    annotations: {}
  api:
    enabled: true
    type: ClusterIP
    port: 8001
    annotations: {}
  metrics:
    enabled: true
    type: ClusterIP
    port: 8002
    annotations: {}

storage:
  backend: memory

redis:
  auth:
    existingSecret: ""
    urlKey: url
  routeKey: pingora-reverse-proxy:routes:v1
  operationTimeoutMs: 2000

sidecar:
  endpoint: ""
  auth:
    existingSecret: ""
    tokenKey: token
  connectTimeoutMs: 1000
  requestTimeoutMs: 2000

tls:
  public:
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
    clientCAKey: ""
    passphraseKey: ""
    requestCert: false
    rejectUnauthorized: false
  api:
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
    clientCAKey: ""
    passphraseKey: ""
    requestCert: false
    rejectUnauthorized: false
  client:
    existingSecret: ""
    certKey: tls.crt
    keyKey: tls.key
    caKey: ""

probes:
  enabled: true
  startup:
    failureThreshold: 30
    periodSeconds: 2
    timeoutSeconds: 1
  readiness:
    failureThreshold: 3
    periodSeconds: 5
    timeoutSeconds: 2
  liveness:
    failureThreshold: 3
    periodSeconds: 10
    timeoutSeconds: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

tmp:
  sizeLimit: 64Mi

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532

terminationGracePeriodSeconds: 30

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
