services:
  chp:
    image: "${CHP_ORACLE_IMAGE:-pingora-chp-oracle:5.3.0-node20}"
    build:
      context: .
      dockerfile_inline: |
        FROM node:20.20.2-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
        RUN mkdir -p /opt/chp-5.3.0
        WORKDIR /opt/chp-5.3.0
        RUN npm pack configurable-http-proxy@5.3.0 \
            && echo "e5abb83b5d9d10514758d9bd63b1319b4e9361cd429cc3afbe9b4f4d4f37570ecdcfd8f48d4a90430283475c53e7682a5fe5fa0fc52e3bbe7875075491e058b9  configurable-http-proxy-5.3.0.tgz" | sha512sum -c - \
            && tar -xzf configurable-http-proxy-5.3.0.tgz --strip-components=1 \
            && rm configurable-http-proxy-5.3.0.tgz \
            && node -e "fetch('https://raw.githubusercontent.com/jupyterhub/configurable-http-proxy/5.3.0/package-lock.json').then(r=>{if(!r.ok)throw new Error(String(r.status));return r.arrayBuffer()}).then(b=>require('fs').writeFileSync('package-lock.json',Buffer.from(b)))" \
            && echo "e55dd25c47058ab05cdcba58b59f4009f49b2fe16f329aa528bf2c233e337cb2  package-lock.json" | sha256sum -c - \
            && npm ci --omit=dev \
            && test "$(node --print "require('./package.json').name")" = "configurable-http-proxy" \
            && test "$(node --print "require('./package.json').version")" = "5.3.0" \
            && test "$(node --print "process.versions.node.split('.')[0]")" = "20"
        COPY scripts/chp-oracle.mjs scripts/chp-runtime.mjs /usr/local/bin/
    command: ["node", "/usr/local/bin/chp-oracle.mjs", "--runtime-probe"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 20

  sidecar:
    image: python:3.13-alpine
    command: ["python", "-m", "http.server", "8080"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=1)
      interval: 1s
      timeout: 1s
      retries: 20
