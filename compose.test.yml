services:
  chp:
    image: "${CHP_ORACLE_IMAGE:-pingora-chp-oracle:5.3.0-node20}"
    build:
      context: .
      dockerfile_inline: |
        FROM node:20.20.2-bookworm-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
        RUN mkdir -p /opt/chp-5.3.0
        WORKDIR /opt/chp-5.3.0
        RUN npm pack configurable-http-proxy@5.3.0 \
            && echo "e5abb83b5d9d10514758d9bd63b1319b4e9361cd429cc3afbe9b4f4d4f37570ecdcfd8f48d4a90430283475c53e7682a5fe5fa0fc52e3bbe7875075491e058b9  configurable-http-proxy-5.3.0.tgz" | sha512sum -c - \
            && tar -xzf configurable-http-proxy-5.3.0.tgz --strip-components=1 \
            && rm configurable-http-proxy-5.3.0.tgz \
            && node -e "fetch('https://raw.githubusercontent.com/jupyterhub/configurable-http-proxy/5.3.0/package-lock.json').then(r=>{if(!r.ok)throw new Error(String(r.status));return r.arrayBuffer()}).then(b=>require('fs').writeFileSync('package-lock.json',Buffer.from(b)))" \
            && echo "e55dd25c47058ab05cdcba58b59f4009f49b2fe16f329aa528bf2c233e337cb2  package-lock.json" | sha256sum -c - \
            && npm ci --omit=dev \
            && test "$(node --print "require('./package.json').name")" = "configurable-http-proxy" \
            && test "$(node --print "require('./package.json').version")" = "5.3.0" \
            && test "$(node --print "process.versions.node.split('.')[0]")" = "20"
        COPY scripts/chp-oracle.mjs scripts/chp-runtime.mjs /usr/local/bin/
    command: ["node", "/usr/local/bin/chp-oracle.mjs", "--runtime-probe"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1::6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 20

  sidecar:
    image: python:3.13-alpine
    command: ["python", "-m", "http.server", "8080"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/', timeout=1)
      interval: 1s
      timeout: 1s
      retries: 20

  jupyterhub-e2e:
    image: "${JUPYTERHUB_E2E_IMAGE:-pingora-jupyterhub-e2e:local}"
    build:
      context: "${JUPYTERHUB_E2E_BUILD_CONTEXT:-.}"
      dockerfile_inline: |
        # syntax=docker/dockerfile:1
        FROM rust:1.85-bookworm@sha256:e51d0265072d2d9d5d320f6a44dde6b9ef13653b035098febd68cce8fa7c0bc4
        RUN apt-get update \
            && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                cmake libpam0g-dev python3-dev python3-pip python3-venv \
            && rm -rf /var/lib/apt/lists/*
        RUN python3 -m venv /opt/jupyterhub \
            && /opt/jupyterhub/bin/python -m pip install --no-cache-dir \
                pip==25.1.1 setuptools==80.9.0 wheel==0.45.1
        RUN /opt/jupyterhub/bin/python -m pip install --no-cache-dir \
                Jinja2==3.1.6 Mako==1.3.12 MarkupSafe==3.0.3 PyYAML==6.0.3 \
                Pygments==2.20.0 SQLAlchemy==2.0.51 Send2Trash==2.1.0 \
                alembic==1.18.5 annotated-types==0.7.0 anyio==4.14.2 \
                argon2-cffi-bindings==25.1.0 argon2-cffi==25.1.0 arrow==1.4.0 \
                asttokens==3.0.2 attrs==26.1.0 beautifulsoup4==4.15.0 \
                bleach==6.4.0 certifi==2026.6.17 certipy==0.2.3 cffi==2.1.0 \
                charset-normalizer==3.4.9 comm==0.2.3 cryptography==49.0.0 \
                debugpy==1.8.21 decorator==5.3.1 defusedxml==0.7.1 \
                executing==2.2.1 fastjsonschema==2.21.2 fqdn==1.5.1 \
                greenlet==3.5.3 idna==3.18 ipykernel==6.30.1 \
                ipython-genutils==0.2.0 ipython==9.15.0 \
                ipython_pygments_lexers==1.1.1 isoduration==20.11.0 \
                jedi==0.20.0 jsonpointer==3.1.1 \
                jsonschema-specifications==2025.9.1 jsonschema==4.26.0 \
                jupyter-events==0.12.1 jupyter_client==8.9.1 jupyter_core==5.9.1 \
                jupyter_server==2.17.0 jupyter_server_terminals==0.5.4 \
                jupyterhub==5.5.0 jupyterlab_pygments==0.3.0 lark==1.3.1 \
                matplotlib-inline==0.2.2 mistune==3.3.3 nbclassic==1.3.3 \
                nbclient==0.11.0 nbconvert==7.17.1 nbformat==5.10.4 \
                nest-asyncio==1.6.0 notebook_shim==0.2.4 oauthlib==3.3.1 \
                overrides==7.7.0 packaging==26.2 pamela==1.2.0 \
                pandocfilters==1.5.1 parso==0.8.7 pexpect==4.9.0 \
                platformdirs==4.10.0 prometheus_client==0.25.0 \
                prompt_toolkit==3.0.52 psutil==7.2.2 ptyprocess==0.7.0 \
                pure_eval==0.2.3 pycparser==3.0 pydantic==2.13.4 \
                pydantic_core==2.46.4 python-dateutil==2.9.0.post0 \
                python-json-logger==4.1.0 pyzmq==27.1.0 referencing==0.37.0 \
                requests==2.32.4 rfc3339-validator==0.1.4 \
                rfc3986-validator==0.1.1 rfc3987-syntax==1.1.0 \
                rpds-py==2026.6.3 six==1.17.0 soupsieve==2.8.4 \
                stack-data==0.6.3 terminado==0.18.1 tinycss2==1.5.1 \
                tornado==6.5.7 traitlets==5.15.1 typing-inspection==0.4.2 \
                typing_extensions==4.16.0 tzdata==2026.3 uri-template==1.3.0 \
                urllib3==2.7.0 wcwidth==0.8.2 webcolors==25.10.0 \
                webencodings==0.5.1 websocket-client==1.8.0
        RUN for name in river '秀樹' 'has@' 'space user'; do \
                useradd --badname --create-home --shell /bin/bash "$$name"; \
            done
        ENV PATH="/opt/jupyterhub/bin:$${PATH}" \
            NO_PROXY="127.0.0.1,localhost,.localhost" \
            no_proxy="127.0.0.1,localhost,.localhost"
        WORKDIR /workspace
        COPY . /workspace
        RUN --mount=type=cache,id=pingora-jupyterhub-e2e-cargo-registry,target=/usr/local/cargo/registry,sharing=locked \
            --mount=type=cache,id=pingora-jupyterhub-e2e-cargo-git,target=/usr/local/cargo/git,sharing=locked \
            --mount=type=cache,id=pingora-jupyterhub-e2e-target,target=/workspace/target,sharing=locked \
            cargo test --locked --test jupyterhub_e2e --no-run \
                --message-format=json-render-diagnostics > /tmp/cargo-messages.json \
            && test_binary="$$(python3 -c 'import json, sys; paths = [message["executable"] for line in sys.stdin if (message := json.loads(line)).get("reason") == "compiler-artifact" and message["target"]["name"] == "jupyterhub_e2e" and message.get("executable")]; assert len(paths) == 1, paths; print(paths[0])' < /tmp/cargo-messages.json)" \
            && install -m 0755 "$$test_binary" /usr/local/bin/jupyterhub-e2e-test \
            && rm /tmp/cargo-messages.json \
            && python3 -m pip check
    init: true
    environment:
      JUPYTERHUB_E2E_RUN: "1"
      STORE_BACKEND: "${STORE_BACKEND:-memory}"
      TEST_REDIS_URL: "redis://redis:6379"
    command: ["/usr/local/bin/jupyterhub-e2e-test", "--nocapture"]
